<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Prototype</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d21; color: #d6d9de;
        font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; }
      [hidden] { display: none !important; }
      #app { display: flex; height: 100%; }
      #viewport { flex: 1; position: relative; min-width: 0; }
      #viewport canvas { display: block; }
      #panel { width: 320px; overflow-y: auto; background: #24272c; border-left: 1px solid #33363c; padding: 8px 12px; box-sizing: border-box; }
      #panel details { border-bottom: 1px solid #33363c; padding-bottom: 4px; }
      #panel summary { margin: 10px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8a9099; cursor: pointer; user-select: none; }
      .row { display: grid; grid-template-columns: 96px 1fr 64px; gap: 6px; align-items: center; margin: 4px 0; }
      .row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row input[type=range] { width: 100%; margin: 0; }
      .row input[type=number], .row input[type=text], .row select {
        width: 100%; box-sizing: border-box; background: #1b1d21; color: inherit; border: 1px solid #3a3e45; border-radius: 3px; padding: 2px 4px; font: inherit; }
      .row select, .row button { grid-column: 2 / 4; }
      .row button { background: #2f333a; color: inherit; border: 1px solid #3a3e45; border-radius: 3px; padding: 3px 6px; font: inherit; cursor: pointer; }
      .row button:hover { background: #3a3f47; }
      .row input[type=color] { width: 100%; height: 22px; padding: 0; border: 1px solid #3a3e45; background: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
