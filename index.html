<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shader Prototype</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d21; color: #d6d9de;
        font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; }
      [hidden] { display: none !important; }
      #app { display: flex; height: 100%; }
      #viewport { flex: 1; position: relative; min-width: 0; }
      #viewport canvas { display: block; }
      #panel { width: 360px; overflow-y: auto; background: #24272c; border-left: 1px solid #33363c; box-sizing: border-box; }
      .panel-head { position: sticky; top: 0; z-index: 1; background: #24272c; padding: 8px 12px 0; border-bottom: 1px solid #33363c; }
      .panel-head input[type=search] { width: 100%; box-sizing: border-box; margin: 6px 0 0; background: #1b1d21; color: inherit;
        border: 1px solid #3a3e45; border-radius: 3px; padding: 4px 6px; font: inherit; }
      .tabs { display: flex; flex-wrap: wrap; margin-top: 6px; }
      .tabs button { flex: 1 0 auto; background: none; border: none; border-bottom: 2px solid transparent; color: #8a9099;
        padding: 6px 3px; font: inherit; font-size: 11px; text-transform: uppercase; cursor: pointer; }
      .tabs button:hover { color: #d6d9de; }
      .tabs button.active { color: #d6d9de; border-bottom-color: #5fa8ff; }
      .panel-body { padding: 0 12px 16px; }
      .tab-page.inactive { display: none; }
      #panel.searching .tab-page.inactive { display: block; }
      #panel.searching .tabs { opacity: .4; pointer-events: none; }
      .tab-page.off-mode, .no-match { display: none !important; }
      #panel details { border-bottom: 1px solid #33363c; padding-bottom: 4px; }
      #panel summary { margin: 10px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8a9099; cursor: pointer; user-select: none; }
      .row { display: grid; grid-template-columns: 96px 1fr 64px; gap: 6px; align-items: center; margin: 4px 0; }
      .row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row input[type=range] { width: 100%; margin: 0; }
      .row input[type=number], .row input[type=text], .row select {
        width: 100%; box-sizing: border-box; background: #1b1d21; color: inherit; border: 1px solid #3a3e45; border-radius: 3px; padding: 2px 4px; font: inherit; }
      .row select, .row button { grid-column: 2 / 4; }
      .row button { background: #2f333a; color: inherit; border: 1px solid #3a3e45; border-radius: 3px; padding: 3px 6px; font: inherit; cursor: pointer; }
      .row button:hover { background: #3a3f47; }
      .row .btns { grid-column: 2 / 4; display: flex; gap: 4px; }
      .row .btns button { flex: 1; min-width: 0; }
      #gallery { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; background: rgba(11, 13, 26, .96); }
      .gallery-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #33363c; }
      .gallery-head button { background: #2f333a; color: inherit; border: 1px solid #3a3e45; border-radius: 3px; padding: 4px 10px; font: inherit; cursor: pointer; }
      .gallery-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px; }
      .gallery-body h4 { margin: 14px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8a9099; }
      .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
      .gallery-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px; background: #1b1d21;
        border: 1px solid #33363c; border-radius: 6px; color: inherit; font: inherit; cursor: pointer; }
      .gallery-card:hover { border-color: #5fa8ff; }
      .gallery-thumb { width: 168px; height: 168px; display: grid; place-items: center; color: #5a5f68; }
      .gallery-thumb:empty::after { content: '…'; }
      .gallery-thumb canvas { width: 168px; height: 168px; border-radius: 4px; }
      .row input[type=color] { width: 100%; height: 22px; padding: 0; border: 1px solid #3a3e45; background: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <aside id="panel"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
